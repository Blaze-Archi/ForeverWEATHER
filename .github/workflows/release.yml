# ForeverWEATHER release build.
#
# Push a tag like v1.6.1-pre (or run the workflow by hand from the Actions tab) and this builds ForeverWEATHER.zip and
# publishes it as a GitHub PRE-RELEASE: the release is marked as a pre-release, its notes open with a notice that the
# build is untested and that bugs go to the Issues tab, and the zip carries the same notice (PRERELEASE_README.txt).
# Only a manual run with "prerelease" unticked publishes a final release (for a build that has been tested in game).
#
# Before anything is published: every version string must match the tag (v1.6.1-pre: 1.6.1), every Lua file must
# compile under LuaJIT (the game's Lua; this also catches the 200-local limit of the main chunk) and every compute
# shader must compile with glslang's HLSL front end against stand-in engine headers (tools/ci/shader_stubs: syntax
# and types only - the game's own compiler still has the last word).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.6.0 (created on the selected commit if it does not exist)'
        required: true
      prerelease:
        description: 'Publish as a pre-release (untested build). Untick only for a build tested in game.'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # tag pushes are always pre-releases; a manual run follows its checkbox
      PRERELEASE: ${{ github.event_name == 'push' && 'true' || github.event.inputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q luajit glslang-tools

      - name: Version matches the tag
        run: python3 tools/build_release.py --check-version "$TAG" --out "$RUNNER_TEMP/check.zip"

      - name: Lua compiles (LuaJIT)
        run: |
          set -e
          for f in lua/ge/extensions/*.lua lua/vehicle/extensions/*.lua scripts/rainPuddles/modScript.lua; do
            luajit -bl "$f" > /dev/null
            echo "ok  $f"
          done

      - name: Shaders compile (glslang HLSL, stand-in engine headers)
        run: bash tools/ci/check_shaders.sh

      - name: Build the zip and the notes
        run: |
          set -e
          mkdir -p dist
          VERSION="${TAG#v}"
          if [ "$PRERELEASE" = "true" ]; then
            python3 tools/build_release.py --out dist/ForeverWEATHER.zip
            python3 tools/release_notes.py "$VERSION" --repo "$GITHUB_REPOSITORY" > dist/notes.md
          else
            python3 tools/build_release.py --final --out dist/ForeverWEATHER.zip
            python3 tools/release_notes.py "$VERSION" --repo "$GITHUB_REPOSITORY" --final > dist/notes.md
          fi
          unzip -l dist/ForeverWEATHER.zip | tail -1
          cat dist/notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="${TAG#v}"
          if [ "$PRERELEASE" = "true" ]; then
            FLAG="--prerelease"
            TITLE="ForeverWEATHER $VERSION (pre-release, untested)"
          else
            FLAG="--prerelease=false"
            TITLE="ForeverWEATHER $VERSION"
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/ForeverWEATHER.zip --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file dist/notes.md $FLAG
          else
            gh release create "$TAG" dist/ForeverWEATHER.zip --title "$TITLE" --notes-file dist/notes.md \
              --target "$GITHUB_SHA" $FLAG
          fi
